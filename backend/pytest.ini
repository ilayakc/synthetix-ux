[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers
markers =
    unit: DB/ag olmayan saf mantik testleri (pricing, quotes, engine baseline, url_safety)
    integration: DB/TestClient icin uctan uca akis testleri (auth, projects, wizard, simulation, reports)
    security: kiraci izolasyonu, SSRF, hiz siniri, ledger idempotency/eszamanlilik testleri
filterwarnings =
    ignore::_pytest.warning_types.PytestCollectionWarning
