# Zero-cost presentation/demo deployment for Render.
# Every declared resource is explicitly on a free plan. Do not use this
# topology as a production SLA: see docs/render-free.md for limitations.
#
# NOTE: Render's free plan has NO Background Worker instance type, so there is
# intentionally NO `type: worker` resource here. The single web service below
# runs the FastAPI API, the ARQ simulation worker, the Playwright analyzer AND
# nginx together in one container via deploy/render_free_start.py (a supervisor
# that fails the container if any child dies). Do NOT add a separate paid
# `type: worker` and do NOT duplicate the db/queue resources - that breaks the
# free Blueprint. Only these THREE resources exist: this web service, the
# Postgres database and the Valkey key-value queue.
#
# The analyzer is deliberately NOT a separate web service: Render free cannot
# serve private traffic, so a separate free analyzer would only be reachable
# over the PUBLIC internet, behind Render/Cloudflare's edge - which returned
# HTTP 429 before requests reached the analyzer app. It now runs in-container
# on 127.0.0.1:8100 (bkz. app.render_free_launcher), reached via loopback.

previews:
  generation: off

services:
  # web + API + ARQ simulation worker (single free instance; see file header).
  - type: web
    name: synthetix-ux-ily
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render-free
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: LOG_EXCLUDE_PATHS
        value: /api/health
      - key: COOKIE_SECURE
        value: "true"
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: synthetix.demo.admin@example.com
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_USER_EMAIL
        value: synthetix.demo.user@example.com
      - key: BOOTSTRAP_USER_PASSWORD
        generateValue: true
      # Herkese acik tek-tik "Canli demoyu incele" (parola gerektirmez).
      # Ayri, taze bir demo hesabi olusturulur; demo-login yalnizca buna
      # oturum acar (bkz. app.routers.auth.demo_login).
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      - key: DEMO_ACCOUNT_EMAIL
        value: synthetix.demo.public@example.com
      - key: DEMO_ACCOUNT_PASSWORD
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ANALYZER_SHARED_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: synthetix-ux-ily-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: synthetix-ux-ily-queue
          property: connectionString
      # Analyzer artik ayni container'da, yalnizca loopback'te dinler (public
      # edge/429 YOK - bkz. dosya basligi ve app.render_free_launcher).
      - key: ANALYZER_BASE_URL
        value: http://127.0.0.1:8100
      # In-container analyzer subprocess'inin okudugu limitler (eski ayri
      # analyzer servisinden tasindi; bkz. analyzer/app/config.py).
      - key: MAX_CONCURRENT_ANALYSES
        value: "1"
      - key: NAVIGATION_TIMEOUT_SECONDS
        value: "45"
      - key: ACCESSIBILITY_SCAN_TIMEOUT_SECONDS
        value: "20"
      - key: ANALYZER_REQUEST_TIMEOUT_SECONDS
        value: "180"
      - key: PAGE_ANALYSIS_STALE_TIMEOUT_SECONDS
        value: "240"
      - key: ANALYZER_DEVICE_NETWORK_TIMEOUT_SECONDS
        value: "180"
      - key: PAGE_ANALYSIS_SCREENSHOT_RETENTION_SECONDS
        value: "86400"
      - key: REPORT_LINKED_SCREENSHOT_RETENTION_SECONDS
        value: "604800"
      - key: DESIGN_ASSET_RETENTION_SECONDS
        value: "86400"
      - key: AI_PROVIDER
        value: none
      - key: IMAGE_GENERATION_PROVIDER
        value: none
      - key: AI_REPORT_ENABLED
        value: "true"
      - key: AI_REPORT_PROVIDER
        value: openai
      - key: AI_INTERACTION_HEATMAP_ENABLED
        value: "true"
      - key: AI_INTERACTION_HEATMAP_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-terra
      - key: OPENAI_REASONING_EFFORT
        value: medium
      - key: OPENAI_MAX_OUTPUT_TOKENS
        value: "4000"

  - type: keyvalue
    name: synthetix-ux-ily-queue
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  - name: synthetix-ux-ily-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: synthetix_ux
    user: synthetix
    ipAllowList: []
