# Production reverse-proxy + statik SPA sunucusu.
#
# - `/` : Vite build ciktisi (statik dosyalar) + SPA fallback (React Router
#   route'lari dogrudan acildiginda/yenilendiginde 404 vermez).
# - `/api/` : docker compose ic agindaki `backend` servisine reverse proxy
#   (ayni-origin - frontend'in build zamaninda VITE_API_BASE_URL="" ile
#   uretilen `/api/...` istekleri buradan gecer).
#
# Guvenlik header'lari YALNIZCA statik (`/`) cevaplara buradan eklenir;
# `/api/` proxy edilen cevaplar zaten backend tarafindan ayni header setiyle
# isaretlenir (bkz. backend/app/main.py create_app) - burada tekrar
# eklenirse duplicate/celiskili header olusur.
server {
    listen 80;
    server_name _;

    # `app.config.design_asset_max_bytes` (10 MiB) yukleme sinirinin
    # UZERINDE, cok-parcali (multipart) govde fazlaligina pay birakan bir
    # deger - asil dogrulama zaten backend'de (bkz.
    # app.routers.design_assets._read_upload_within_limit) yapilir, burada
    # yalnizca nginx'in mesru bir yuklemeyi ERKEN reddetmemesi saglanir.
    client_max_body_size 12m;

    # Backend'in FastAPI docs/openapi route'lari `/api` prefix'i ALTINDA
    # DEGILDIR (bkz. backend/app/main.py) ve zaten `/api/` disinda hicbir
    # yol backend'e proxy edilmedigi icin bu yollar backend'e hic ULASMAZ.
    # Bunlari acikca 404 ile kapatiyoruz - aksi halde asagidaki SPA
    # fallback (`try_files ... /index.html`) bu yollar icin React kabugunu
    # 200 ile donerdi, ki bu "kapali" beklentisini (acik 404) karsilamaz.
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    location /api/ {
        proxy_pass http://backend:8000;

        # Gercek client IP/proto/host - backend'in (ornegin ileride eklenecek
        # IP-tabanli hiz sinirlama/loglama icin) proxy ARKASINDAKI gercek
        # istemciyi gorebilmesi icin.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Senkron calisan tasarim gorseli yukleme/decode/re-encode akisi
        # (bkz. app.routers.design_assets.upload_design_asset) icin makul bir
        # pay; sayfa/URL analizi (analyzer, potansiyel olarak cok daha uzun
        # surebilir) ZATEN kuyruklu/asenkron oldugu ve nginx uzerinden
        # senkron beklenmedigi icin bu deger o akisi etkilemez.
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering on;
    }
}
