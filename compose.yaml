name: synthetix-ux

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synthetix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-synthetix_ux}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synthetix} -d ${POSTGRES_DB:-synthetix_ux}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://synthetix:devpassword@db:5432/synthetix_ux}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYZER_BASE_URL: ${ANALYZER_BASE_URL:-http://analyzer:8100}
      ANALYZER_SHARED_TOKEN: ${ANALYZER_SHARED_TOKEN:-dev-insecure-analyzer-token-change-me}
      # `env_file: .env` her zaman literal `.env` dosyasini okur; bu deger
      # ise izole E2E stack'inin (`compose.e2e.env`, bkz. docs/testing.md)
      # `--env-file` ile farkli bir origin (`http://frontend:5173`)
      # gecebilmesi icin acikca degisken ikamesiyle tanimlanir.
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: arq app.worker.WorkerSettings
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://synthetix:devpassword@db:5432/synthetix_ux}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ANALYZER_BASE_URL: ${ANALYZER_BASE_URL:-http://analyzer:8100}
      ANALYZER_SHARED_TOKEN: ${ANALYZER_SHARED_TOKEN:-dev-insecure-analyzer-token-change-me}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      analyzer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  analyzer:
    build:
      context: ./analyzer
    env_file:
      - .env
    environment:
      ANALYZER_SHARED_TOKEN: ${ANALYZER_SHARED_TOKEN:-dev-insecure-analyzer-token-change-me}
    # Kasitli olarak host'a bir port yayinlanmaz: bu servis, kullanicinin
    # girdigi keyfi bir URL'yi gercekten ziyaret eden tek bilesendir ve
    # yalnizca docker compose'un ic ag'i uzerinden (backend/worker'in
    # `ANALYZER_BASE_URL` araciligiyla) erisilebilir olmalidir - bkz.
    # docs/security.md "Operasyon limitleri".
    volumes:
      - ./analyzer:/app
    # Playwright/Chromium bellek/CPU acisindan agir olabilecegi ve
    # kullanicinin kontrol ettigi bir URL'yi isledigi icin sinirlandirilir
    # (bkz. docs/security.md "Kaynak sinirlari").
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  frontend_node_modules:
